<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Representación vectorial de clustering</title>
  <desc id="desc">Gráfico de dispersión cuadrado con tres grupos, centroides y ejes cartesianos.</desc>

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#172033" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3 0 6Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Cuadrícula -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 5" opacity=".55">
    <path d="M55 310H365M55 245H365M55 180H365M55 115H365"/>
    <path d="M120 340V30M185 340V30M250 340V30M315 340V30"/>
  </g>

  <!-- Áreas de pertenencia -->
  <path d="M72 82c17-43 74-58 117-35 40 21 47 71 20 104-29 36-88 40-124 11-25-20-28-52-13-80Z"
        fill="#3B82F6" fill-opacity=".13" stroke="#3B82F6" stroke-width="2"
        stroke-opacity=".48" stroke-dasharray="6 5"/>
  <path d="M239 63c38-31 94-19 116 23 20 39 2 85-40 101-42 16-91-8-102-50-8-29 1-55 26-74Z"
        fill="#F59E0B" fill-opacity=".14" stroke="#F59E0B" stroke-width="2"
        stroke-opacity=".52" stroke-dasharray="6 5"/>
  <path d="M140 220c28-37 87-47 127-22 38 24 50 75 24 108-29 38-90 48-130 21-37-24-48-72-21-107Z"
        fill="#10B981" fill-opacity=".13" stroke="#10B981" stroke-width="2"
        stroke-opacity=".5" stroke-dasharray="6 5"/>

  <!-- Puntos -->
  <g stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)">
    <g fill="#3B82F6">
      <circle cx="91" cy="91" r="6"/><circle cx="119" cy="69" r="5"/>
      <circle cx="148" cy="83" r="7"/><circle cx="180" cy="68" r="5"/>
      <circle cx="191" cy="105" r="6"/><circle cx="158" cy="121" r="5"/>
      <circle cx="122" cy="127" r="7"/><circle cx="88" cy="137" r="5"/>
      <circle cx="145" cy="151" r="6"/>
    </g>
    <g fill="#F59E0B">
      <circle cx="246" cy="84" r="6"/><circle cx="278" cy="59" r="7"/>
      <circle cx="316" cy="76" r="5"/><circle cx="342" cy="103" r="6"/>
      <circle cx="276" cy="111" r="5"/><circle cx="314" cy="128" r="7"/>
      <circle cx="346" cy="148" r="5"/><circle cx="259" cy="148" r="6"/>
      <circle cx="302" cy="164" r="5"/>
    </g>
    <g fill="#10B981">
      <circle cx="155" cy="248" r="6"/><circle cx="182" cy="224" r="5"/>
      <circle cx="212" cy="242" r="7"/><circle cx="246" cy="225" r="6"/>
      <circle cx="272" cy="251" r="5"/><circle cx="172" cy="282" r="7"/>
      <circle cx="207" cy="300" r="5"/><circle cx="242" cy="281" r="6"/>
      <circle cx="272" cy="302" r="7"/>
    </g>
  </g>

  <!-- Centroides -->
  <g filter="url(#shadow)">
    <g transform="translate(140 108)">
      <circle r="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/>
      <path d="M0-6 1.8-2 6-1.8 2.6.8 3.6 5 0 2.7-3.6 5-2.6.8-6-1.8-1.8-2Z" fill="#3B82F6"/>
    </g>
    <g transform="translate(299 111)">
      <circle r="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
      <path d="M0-6 1.8-2 6-1.8 2.6.8 3.6 5 0 2.7-3.6 5-2.6.8-6-1.8-1.8-2Z" fill="#F59E0B"/>
    </g>
    <g transform="translate(216 267)">
      <circle r="12" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
      <path d="M0-6 1.8-2 6-1.8 2.6.8 3.6 5 0 2.7-3.6 5-2.6.8-6-1.8-1.8-2Z" fill="#10B981"/>
    </g>
  </g>

  <!-- Ejes -->
  <g fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round">
    <path d="M55 340H371" marker-end="url(#arrow)"/>
    <path d="M55 340V23" marker-end="url(#arrow)"/>
  </g>
  <g fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">
    <text x="371" y="363" text-anchor="end">X</text>
    <text x="36" y="27" text-anchor="middle">Y</text>
  </g>
</svg>
