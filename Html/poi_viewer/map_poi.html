  <!-- 4. Recibir configuración desde Quarto -->
  <script>
    window.addEventListener("message", async function(event) {
      const cfg = event.data;

      const payload = cfg?.data_enviar || cfg?.areas || cfg;
      const hasAreas = payload && (
        payload.area_seleccionada ||
        Object.values(payload).some(area =>
          area?.area_seleccionada || area?.areas?.area_seleccionada
        )
      );

      if (!hasAreas) {
        debug("↪ Mensaje ignorado");
        return;
      }

      debug("📩 Config válida recibida");

      if (!window.cargarDatosPoi) {
        debug("❌ window.cargarDatosPoi no existe");
        return;
      }

      try {
        await window.cargarDatosPoi(cfg);
        debug("✅ cargarDatosPoi ejecutado");
      } catch (error) {
        debug("❌ Error: " + error.message);
        console.error(error);
      }
    });

    debug("✅ Listener registrado");
  </script>
